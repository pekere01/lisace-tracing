<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmalar — Enstrüman Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept-c-shared.css">
<style>
  .family-chip{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line-bright)}
  .row-enter{opacity:0;transform:translateY(6px);animation:rowIn 380ms var(--ease-out) forwards}
  @keyframes rowIn{ to{opacity:1;transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce){ .row-enter{animation:none;opacity:1;transform:none} }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3"/><path d="M17 6l3 3"/><path d="M14 9l2 2"/></symbol>
<symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
</svg>
<header>
  <div class="wordmark"><span class="led"></span>LİSANS · KONTROL PANELİ</div>
  <nav>
    <a href="concept-c-enstruman-paneli.html">Panel</a>
    <a class="active" href="concept-c-firmalar.html">Firmalar</a>
    <a href="concept-c-yeni-firma.html">Yeni Firma</a>
    <a href="concept-c-uyarilar.html">Uyarılar <span class="pip">5</span></a>
    <a href="concept-c-kullanicilar.html">Kullanıcılar</a>
  </nav>
  <div class="clock" id="clock"></div>
</header>

<main>
  <div class="page-head">
    <div><h1>Firma Kayıtları</h1><p>10 / 10 kayıt listeleniyor</p></div>
    <a class="btn btn-primary" href="concept-c-yeni-firma.html">+ Yeni Firma</a>
  </div>

  <div class="toolbar">
    <div class="search"><svg class="icon"><use href="#i-search"/></svg><input placeholder="firma ara..."></div>
    <button class="filter-chip active">Tümü</button>
    <button class="filter-chip">SolidWorks</button>
    <button class="filter-chip">SolidCAM</button>
    <button class="filter-chip">≤30 gün</button>
    <button class="filter-chip">Süresi geçmiş</button>
  </div>

  <div class="card-block" style="padding:0;overflow:hidden">
    <table class="ledger">
      <thead><tr><th>KOD</th><th>FİRMA</th><th>YETKİLİ</th><th>LİSANSLAR</th><th>KALAN</th><th style="text-align:right">DURUM</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<footer>Kavram C · Atölye Enstrüman Paneli — Firma Kayıtları — demo verisi kurgusaldır</footer>

<script>
const TODAY = new Date('2026-09-06');
const companies = [
  { kod:"F-027", firma:"Vega Makine Ltd. Şti.", kisi:"Melis Vega", fam:{SW:0,CAM:1,CIM:0}, bitis:"2026-08-30" },
  { kod:"F-031", firma:"Trio Makina San.", kisi:"Onur Tarhan", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-09-08" },
  { kod:"F-014", firma:"Aydın Kalıp San. Tic. A.Ş.", kisi:"Serkan Aydın", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-09-10" },
  { kod:"F-042", firma:"Demirtaş Precision", kisi:"Ayça Demirtaş", fam:{SW:1,CAM:1,CIM:0}, bitis:"2026-09-30" },
  { kod:"F-055", firma:"Çelik Form Endüstri", kisi:"Barış Çelik", fam:{SW:0,CAM:0,CIM:1}, bitis:"2026-10-01" },
  { kod:"F-063", firma:"Nova Otomasyon A.Ş.", kisi:"Ece Nova", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-10-15" },
  { kod:"F-093", firma:"Yıldız Kaynak Sistemleri", kisi:"Tolga Yıldız", fam:{SW:0,CAM:1,CIM:0}, bitis:"2026-11-20" },
  { kod:"F-071", firma:"Boru Hattı Mühendislik", kisi:"Kaan Boru", fam:{SW:1,CAM:1,CIM:0}, bitis:"2026-12-20" },
  { kod:"F-080", firma:"Kalender Metal", kisi:"Derya Kalender", fam:{SW:0,CAM:0,CIM:1}, bitis:"2027-01-15" },
  { kod:"F-101", firma:"Orion Kalıp ve Model", kisi:"Sena Orion", fam:{SW:1,CAM:0,CIM:0}, bitis:"2027-02-10" },
];

function daysLeft(dateStr){ return Math.round((new Date(dateStr) - TODAY) / 86400000); }
function statusOf(d){ return d<=30 ? "crit" : d<=60 ? "warn" : "ok"; }
function label(s){ return s==="crit"?"ALARM":s==="warn"?"İZLE":"NORMAL"; }
function colorVar(s){ return s==="crit"?"--phos-red":s==="warn"?"--phos-amber":"--phos-green"; }

let data = companies.map(c => { const days = daysLeft(c.bitis); return {...c, days, status: statusOf(days)}; })
  .sort((a,b)=>a.days-b.days);

const rowsEl = document.getElementById('rows');
data.forEach((c,i) => {
  const pct = Math.max(4, Math.min(100, Math.round((1 - Math.min(Math.max(c.days,0),365)/365)*100)));
  const dayText = c.days < 0 ? `+${Math.abs(c.days)}` : `${c.days}`;
  const chips = Object.entries(c.fam).filter(([,n])=>n>0).map(([k,n])=>`<span class="family-chip">${k}×${n}</span>`).join(' ');
  const tr = document.createElement('tr');
  tr.className = 'row-enter';
  tr.style.animationDelay = (i*40)+'ms';
  tr.style.cursor = 'pointer';
  tr.innerHTML = `
    <td class="mono" style="color:var(--text-dim)">${c.kod}</td>
    <td><div class="firma-cell"><span class="dot dot-${c.status}"></span>${c.firma}</div></td>
    <td style="color:var(--text-dim)">${c.kisi}</td>
    <td>${chips || '—'}</td>
    <td>
      <div class="mono" style="font-size:12px">${dayText}</div>
      <div class="bar"><span style="width:${pct}%;background:var(${colorVar(c.status)})"></span></div>
    </td>
    <td style="text-align:right"><span class="chip chip-${c.status}">${label(c.status)}</span></td>
  `;
  tr.addEventListener('click', () => window.location.href = 'concept-c-firma-detay.html');
  rowsEl.appendChild(tr);
});

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 15000);
</script>
</body>
</html>
