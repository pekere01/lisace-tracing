<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmalar — Kalibrasyon Etiketi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept-a-shared.css">
<style>
  .family-chip{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--kraft);color:var(--kraft-ink);border:1px solid var(--kraft-shadow)}
  .row-enter{opacity:0;transform:translateY(6px);animation:rowIn 380ms var(--ease-out) forwards}
  @keyframes rowIn{ to{opacity:1;transform:translateY(0)} }
  @media (prefers-reduced-motion: reduce){ .row-enter{animation:none;opacity:1;transform:none} }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3"/><path d="M17 6l3 3"/><path d="M14 9l2 2"/></symbol>
<symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
</svg>
<header>
  <div class="wordmark"><span class="hole"></span> LİSANS PANELİ</div>
  <nav>
    <a class="tab" href="concept-a-kalibrasyon.html">Panel</a>
    <a class="tab active" href="concept-a-firmalar.html">Firmalar</a>
    <a class="tab" href="concept-a-yeni-firma.html">Yeni Firma</a>
    <a class="tab" href="concept-a-uyarilar.html">Uyarılar <span class="pip">5</span></a>
    <a class="tab" href="concept-a-kullanicilar.html">Kullanıcılar</a>
  </nav>
  <div class="user">EA</div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>Firma Listesi</h1>
      <p>10 / 10 firma gösteriliyor</p>
    </div>
    <a class="btn btn-primary" href="concept-a-yeni-firma.html">+ Yeni Firma</a>
  </div>

  <div class="toolbar">
    <div class="search"><svg class="icon"><use href="#i-search"/></svg><input placeholder="Şirket adı ara..." /></div>
    <button class="filter-chip active">Tümü</button>
    <button class="filter-chip">SolidWorks</button>
    <button class="filter-chip">SolidCAM</button>
    <button class="filter-chip">30 gün içinde</button>
    <button class="filter-chip">Süresi geçmiş</button>
  </div>

  <div class="card-block" style="padding:0;overflow:hidden">
    <table class="ledger">
      <thead>
        <tr><th>Firma</th><th>Yetkili</th><th>Lisanslar</th><th>En Yakın Yenileme</th><th style="text-align:right">Durum</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<footer>Kavram A · Kalibrasyon Etiketi — Firma Listesi — demo verisi kurgusaldır</footer>

<script>
const TODAY = new Date('2026-09-06');
const companies = [
  { firma:"Vega Makine Ltd. Şti.", kisi:"Melis Vega", tel:"0533 xxx xx xx", fam:{SW:0,CAM:1,CIM:0}, bitis:"2026-08-30" },
  { firma:"Trio Makina San.", kisi:"Onur Tarhan", tel:"0535 xxx xx xx", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-09-08" },
  { firma:"Aydın Kalıp San. Tic. A.Ş.", kisi:"Serkan Aydın", tel:"0532 xxx xx xx", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-09-10" },
  { firma:"Demirtaş Precision", kisi:"Ayça Demirtaş", tel:"0536 xxx xx xx", fam:{SW:1,CAM:1,CIM:0}, bitis:"2026-09-30" },
  { firma:"Çelik Form Endüstri", kisi:"Barış Çelik", tel:"0538 xxx xx xx", fam:{SW:0,CAM:0,CIM:1}, bitis:"2026-10-01" },
  { firma:"Nova Otomasyon A.Ş.", kisi:"Ece Nova", tel:"0542 xxx xx xx", fam:{SW:1,CAM:0,CIM:0}, bitis:"2026-10-15" },
  { firma:"Yıldız Kaynak Sistemleri", kisi:"Tolga Yıldız", tel:"0546 xxx xx xx", fam:{SW:0,CAM:1,CIM:0}, bitis:"2026-11-20" },
  { firma:"Boru Hattı Mühendislik", kisi:"Kaan Boru", tel:"0544 xxx xx xx", fam:{SW:1,CAM:1,CIM:0}, bitis:"2026-12-20" },
  { firma:"Kalender Metal", kisi:"Derya Kalender", tel:"0545 xxx xx xx", fam:{SW:0,CAM:0,CIM:1}, bitis:"2027-01-15" },
  { firma:"Orion Kalıp ve Model", kisi:"Sena Orion", tel:"0549 xxx xx xx", fam:{SW:1,CAM:0,CIM:0}, bitis:"2027-02-10" },
];

function daysLeft(dateStr){ return Math.round((new Date(dateStr) - TODAY) / 86400000); }
function statusOf(d){ return d<=30 ? "crit" : d<=60 ? "warn" : "ok"; }
function label(s){ return s==="crit"?"Kritik":s==="warn"?"Yakında":"Sağlıklı"; }

let data = companies.map(c => { const days = daysLeft(c.bitis); return {...c, days, status: statusOf(days)}; })
  .sort((a,b)=>a.days-b.days);

const rowsEl = document.getElementById('rows');
data.forEach((c,i) => {
  const pct = Math.max(4, Math.min(100, Math.round((1 - Math.min(Math.max(c.days,0),365)/365)*100)));
  const dayText = c.days < 0 ? `${Math.abs(c.days)} gün geçti` : `${c.days} gün kaldı`;
  const chips = Object.entries(c.fam).filter(([,n])=>n>0).map(([k,n])=>`<span class="family-chip">${k}×${n}</span>`).join(' ');
  const tr = document.createElement('tr');
  tr.className = 'row-enter';
  tr.style.animationDelay = (i*40)+'ms';
  tr.innerHTML = `
    <td><div class="firma-cell"><span class="dot dot-${c.status}"></span>${c.firma.toUpperCase()}</div></td>
    <td><div>${c.kisi}</div><div class="mono" style="font-size:11px;color:var(--ink-soft)">${c.tel}</div></td>
    <td>${chips || '—'}</td>
    <td>
      <div class="mono" style="font-size:12px">${dayText}</div>
      <div class="bar"><span style="width:${pct}%;background:var(--${c.status==='crit'?'crit':c.status==='warn'?'warn':'ok'})"></span></div>
    </td>
    <td style="text-align:right"><span class="chip chip-${c.status}">${label(c.status)}</span></td>
  `;
  tr.querySelector('.firma-cell').style.cursor = 'pointer';
  tr.addEventListener('click', () => window.location.href = 'concept-a-firma-detay.html');
  rowsEl.appendChild(tr);
});
</script>
</body>
</html>
